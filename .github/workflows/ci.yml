name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# Read-only token; this workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-and-http-tests:
    name: Service + HTTP tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests (browser tests excluded in this job)
        run: python -m pytest -q -m "not e2e" tests
      - name: Launcher check-only on a fresh instance dir
        run: MOBLAB_INSTANCE_DIR="$RUNNER_TEMP/moblab" MOBLAB_PYTHON="$(command -v python)" bash launch_demo.command --check-only

  browser-tests:
    name: Chromium end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies and Chromium for Playwright
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m pytest -q -m e2e tests
