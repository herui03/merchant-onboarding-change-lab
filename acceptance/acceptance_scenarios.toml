# Developer acceptance scenarios — hand-authored BEFORE implementation.
#
# These are expected outcomes for automated developer acceptance checks. They are NOT
# external UAT: no business tester has executed them, and no signoff exists.
#
# Business-date authority: the server-side lab clock (meta.business_date) is the only
# date used for policy selection, submission and decision stamps. Callers cannot supply one.

[meta]
lab_business_date_after_seed = "2026-06-24"
v2_effective_from = "2026-07-01"

# ---------------------------------------------------------------------------
# Expected seed state (synthetic). Written before seed/engine code exists.
# expected_migration = classification when policy owner applies v2 on/after 2026-07-01.
# ---------------------------------------------------------------------------
